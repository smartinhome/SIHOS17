name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.1
          target: esp32c6

      - name: Build firmware
        working-directory: firmware
        run: |
          idf.py set-target esp32c6
          idf.py build

      - name: Rename artifacts
        working-directory: firmware/build
        run: |
          cp sih-wmbus-reader.bin firmware.bin
          cp bootloader/bootloader.bin bootloader.bin
          cp partition_table/partition-table.bin partition-table.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: |
            firmware/build/firmware.bin
            firmware/build/bootloader.bin
            firmware/build/partition-table.bin
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SIH wMbus Reader ${{ github.ref_name }}
          body: |
            ## SIH wMbus Reader ${{ github.ref_name }}
            ### Instalacja OTA
            URL do aktualizacji:
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/firmware.bin
          files: |
            dist/firmware.bin
            dist/bootloader.bin
            dist/partition-table.bin
          prerelease: ${{ contains(github.ref_name, 'beta') }}
