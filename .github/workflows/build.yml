name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw wersje firmware z nazwy tagu
        # ESP-IDF czyta firmware/version.txt zamiast 'git describe'. Dzieki temu
        # build z tagu vX.Y.Z zawsze zaszywa dokladnie te wersje, nawet gdy na
        # tym samym commicie wisi tez tag beta (git describe wybralby zly).
        # Dla pushu na branch (bez tagu) zostaje git describe (brak version.txt).
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ github.ref_name }}" > firmware/version.txt
            echo "version.txt = ${{ github.ref_name }}"
          else
            echo "push na branch - wersja z git describe"
          fi

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.1
          target: esp32c6
          path: firmware

      - name: List build artifacts
        run: find firmware/build -name "*.bin" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: |
            firmware/build/sih-wmbus-reader.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: dist/

      - name: List downloaded files
        run: find dist/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SIH wMbus Reader ${{ github.ref_name }}
          body: |
            ## SIH wMbus Reader ${{ github.ref_name }}
            ### OTA URL
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sih-wmbus-reader.bin
          files: dist/**/*.bin
          prerelease: ${{ contains(github.ref_name, 'beta') }}
